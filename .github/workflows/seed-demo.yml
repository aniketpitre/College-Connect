# Fills a NEW, empty database with the demo college (staff of every role, 60 students, fees,
# attendance, marks, results, certificates, admissions, library, hostel, placement, NAAC…) for a
# presentation. Run it from GitHub → Actions → "Load demo data" → Run workflow.
#
# Needs the repository secret MONGODB_URI (Settings → Secrets and variables → Actions). The real
# database ("collegeconnect") is refused; the demo goes into its own database, so switching the
# site to it and back is just the MONGODB_DB setting in Vercel.
name: Load demo data

on:
  workflow_dispatch:
    inputs:
      database:
        description: "Database to fill (must be new or empty; never the real one)"
        required: true
        default: collegeconnect_demo

permissions:
  contents: read

jobs:
  seed:
    name: Seed the demo database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start a local MongoDB (the demo is built here, then copied to Atlas in bulk)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Check the secret
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::Add the MONGODB_URI repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Build the demo college (locally)
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
          MONGODB_DB: ${{ inputs.database }}
        run: |
          set -o pipefail
          python -m scripts.seed_demo --erp 2>&1 | grep -v "HTTP Request" | tee seed.log
      - name: Copy it to Atlas
        working-directory: backend
        env:
          TARGET_MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DB: ${{ inputs.database }}
        run: |
          python -m scripts.copy_database --replace \
            --source-uri "mongodb://localhost:27017/?replicaSet=rs0&directConnection=true" \
            --source-db "$DB" --target-db "$DB"
          {
            echo "## Demo data loaded into \`$DB\`"
            echo
            echo "In Vercel, set \`MONGODB_DB\` = \`$DB\` (Production) and redeploy. Delete it again to go back to the real data."
            echo
            echo '```'
            grep -A40 "Demo sign-ins" seed.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
